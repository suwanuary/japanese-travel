<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅の日本語 - 여행 일본어 회화</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FAF7F2;
            --bg-warm: #F5F0E8;
            --accent-red: #C73E3A;
            --accent-pink: #E8A5A0;
            --accent-green: #4A9B7F;
            --accent-blue: #5B8DBE;
            --accent-purple: #8B7BB5;
            --accent-orange: #E8945A;
            --text-dark: #2C2C2C;
            --text-medium: #5A5A5A;
            --text-light: #8A8A8A;
            --white: #FFFFFF;
            --shadow-soft: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.1);
            --border-light: #E8E4DC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
            background: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.7;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: var(--white);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-soft);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 1.2rem;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .logo-text span {
            color: var(--accent-red);
            font-weight: 700;
        }

        nav {
            display: flex;
            gap: 0.5rem;
        }

        nav button {
            padding: 0.5rem 1rem;
            border: none;
            background: transparent;
            color: var(--text-medium);
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        nav button:hover, nav button.active {
            background: var(--accent-red);
            color: var(--white);
        }

        /* Admin Toggle Button */
        .admin-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--accent-purple);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: var(--shadow-hover);
            z-index: 1000;
            transition: transform 0.3s;
        }

        .admin-toggle:hover {
            transform: scale(1.1);
        }

        .admin-toggle.logged-in {
            background: var(--accent-green);
        }

        /* Admin Status Badge */
        .admin-badge {
            position: fixed;
            bottom: 75px;
            right: 20px;
            background: var(--accent-green);
            color: white;
            padding: 0.3rem 0.75rem;
            border-radius: 15px;
            font-size: 0.75rem;
            display: none;
            z-index: 1000;
        }

        .admin-badge.show {
            display: block;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .hero h1 span {
            font-weight: 700;
            color: var(--accent-red);
        }

        .hero p {
            color: var(--text-medium);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        /* Category Cards */
        .categories {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .category-card {
            background: var(--white);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .category-card.active {
            border-color: var(--accent-red);
            background: linear-gradient(135deg, #FFF5F5 0%, var(--white) 100%);
        }

        .category-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .category-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .category-subtitle {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 0.25rem;
        }

        /* Conversation Section */
        .conversation-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--accent-red);
            border-radius: 2px;
        }

        .situation-badge {
            background: var(--bg-warm);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-medium);
        }

        /* Dialogue Cards */
        .dialogue-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .dialogue-card {
            background: var(--white);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--shadow-soft);
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
            position: relative;
        }

        .dialogue-card:nth-child(1) { animation-delay: 0.1s; }
        .dialogue-card:nth-child(2) { animation-delay: 0.2s; }
        .dialogue-card:nth-child(3) { animation-delay: 0.3s; }
        .dialogue-card:nth-child(4) { animation-delay: 0.4s; }
        .dialogue-card:nth-child(5) { animation-delay: 0.5s; }
        .dialogue-card:nth-child(6) { animation-delay: 0.6s; }
        .dialogue-card:nth-child(7) { animation-delay: 0.7s; }
        .dialogue-card:nth-child(8) { animation-delay: 0.8s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dialogue-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .speaker-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .speaker-avatar.person-a {
            background: linear-gradient(135deg, #FFE4E4 0%, #FFF0F0 100%);
        }

        .speaker-avatar.person-b {
            background: linear-gradient(135deg, #E4F0FF 0%, #F0F6FF 100%);
        }

        .speaker-info {
            flex: 1;
        }

        .speaker-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .speaker-role {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--bg-warm);
            color: var(--accent-red);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: var(--accent-red);
            color: var(--white);
            transform: scale(1.1);
        }

        .action-btn.saved {
            background: var(--accent-orange);
            color: white;
        }

        .dialogue-content {
            padding-left: 56px;
        }

        .japanese-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            line-height: 1.8;
        }

        .japanese-text ruby {
            ruby-position: over;
        }

        .japanese-text rt {
            font-size: 0.55em;
            color: var(--accent-red);
            font-weight: 400;
        }

        .romaji-text {
            font-size: 0.85rem;
            color: var(--text-light);
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        .korean-text {
            font-size: 0.95rem;
            color: var(--text-medium);
            padding: 0.75rem 1rem;
            background: var(--bg-cream);
            border-radius: 12px;
            border-left: 3px solid var(--accent-pink);
        }

        /* Tip Box */
        .tip-box {
            background: linear-gradient(135deg, #FFF5F0 0%, #FFFAF5 100%);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            margin-top: 1.5rem;
            border: 1px solid #FFE4D6;
        }

        .tip-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .tip-icon {
            font-size: 1.2rem;
        }

        .tip-title {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--accent-red);
        }

        .tip-content {
            font-size: 0.9rem;
            color: var(--text-medium);
            line-height: 1.6;
        }

        /* ========== 단어장 스타일 ========== */
        .vocabulary-section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .vocab-card {
            background: var(--white);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .vocab-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .vocab-card.flipped .vocab-front {
            display: none;
        }

        .vocab-card.flipped .vocab-back {
            display: block;
        }

        .vocab-back {
            display: none;
        }

        .vocab-japanese {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .vocab-reading {
            font-size: 0.9rem;
            color: var(--accent-red);
            margin-bottom: 0.25rem;
        }

        .vocab-korean {
            font-size: 1rem;
            color: var(--text-medium);
        }

        .vocab-example {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--border-light);
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .vocab-category-tag {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--bg-warm);
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.7rem;
            color: var(--text-medium);
        }

        .vocab-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        /* ========== 퀴즈 스타일 ========== */
        .quiz-section {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
        }

        .quiz-card {
            background: var(--white);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow-soft);
            text-align: center;
        }

        .quiz-progress {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .quiz-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border-light);
            transition: all 0.3s;
        }

        .quiz-dot.active {
            background: var(--accent-red);
            transform: scale(1.2);
        }

        .quiz-dot.correct {
            background: var(--accent-green);
        }

        .quiz-dot.wrong {
            background: var(--accent-red);
        }

        .quiz-question {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .quiz-hint {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .quiz-option {
            padding: 1rem;
            border: 2px solid var(--border-light);
            border-radius: 12px;
            background: var(--white);
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 1rem;
        }

        .quiz-option:hover {
            border-color: var(--accent-red);
            background: #FFF5F5;
        }

        .quiz-option.correct {
            border-color: var(--accent-green);
            background: #E8F5E9;
        }

        .quiz-option.wrong {
            border-color: #E57373;
            background: #FFEBEE;
        }

        .quiz-result {
            text-align: center;
            padding: 2rem;
        }

        .quiz-score {
            font-size: 4rem;
            font-weight: 700;
            color: var(--accent-red);
        }

        .quiz-message {
            font-size: 1.2rem;
            color: var(--text-medium);
            margin: 1rem 0 2rem;
        }

        /* ========== 저장함 스타일 ========== */
        .saved-section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .saved-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .saved-tab {
            padding: 0.5rem 1rem;
            border: none;
            background: var(--white);
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .saved-tab:hover, .saved-tab.active {
            background: var(--accent-red);
            color: white;
        }

        .saved-count {
            background: rgba(0,0,0,0.1);
            padding: 0.1rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* ========== 모달 스타일 ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--white);
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--bg-warm);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--accent-red);
            color: white;
        }

        .btn-primary:hover {
            background: #B33633;
        }

        .btn-secondary {
            background: var(--bg-warm);
            color: var(--text-dark);
        }

        .btn-logout {
            background: var(--text-light);
            color: white;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        /* Admin Panel Tabs */
        .admin-tabs {
            display: flex;
            gap: 0.5rem;
            padding: 0 1.5rem;
            border-bottom: 1px solid var(--border-light);
        }

        .admin-tab {
            padding: 0.75rem 1rem;
            border: none;
            background: none;
            cursor: pointer;
            font-family: inherit;
            color: var(--text-medium);
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .admin-tab.active {
            color: var(--accent-red);
            border-bottom-color: var(--accent-red);
        }

        .admin-content {
            display: none;
        }

        .admin-content.active {
            display: block;
        }

        /* Data List */
        .data-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            border-radius: 10px;
            background: var(--bg-cream);
            margin-bottom: 0.5rem;
        }

        .data-item-text {
            flex: 1;
        }

        .data-item-title {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .data-item-sub {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .data-item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .icon-btn.edit {
            background: var(--accent-blue);
            color: white;
        }

        .icon-btn.delete {
            background: #E57373;
            color: white;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 30px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 3000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Loading Spinner */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-light);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Login Form Styles */
        .login-form {
            text-align: center;
            padding: 2rem;
        }

        .login-form h3 {
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }

        .login-form .form-input {
            max-width: 300px;
            margin: 0 auto 1rem;
            text-align: center;
        }

        .login-error {
            color: #E57373;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
                font-size: 1.8rem;
            }

            .categories {
                grid-template-columns: repeat(3, 1fr);
                gap: 0.75rem;
                padding: 0 1rem 1rem;
            }

            .category-card {

    <script>
        // ==================== Firebase 설정 ====================
        const firebaseConfig = {

            authDomain: "japanese-travel-c3206.firebaseapp.com",
            projectId: "japanese-travel-c3206",
            storageBucket: "japanese-travel-c3206.firebasestorage.app",
            messagingSenderId: "927295284274",
            appId: "1:927295284274:web:9bbfbd7b19f6f7b014c82b",
            measurementId: "G-R8Y767FZ82"
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ==================== 관리자 설정 ====================
        const ADMIN_PASSWORD = 'zzzacs1';
        let isAdminLoggedIn = false;

        // ==================== 기본 데이터 ====================
        const defaultCategories = [
            { id: 'airport', icon: '✈️', title: '공항', subtitle: '空港' },
            { id: 'restaurant', icon: '🍜', title: '식당', subtitle: 'レストラン' },
            { id: 'shopping', icon: '🛍️', title: '쇼핑', subtitle: 'ショッピング' },
            { id: 'hotel', icon: '🏨', title: '호텔', subtitle: 'ホテル' },
            { id: 'transport', icon: '🚃', title: '교통', subtitle: '交通' },
            { id: 'emergency', icon: '🆘', title: '긴급상황', subtitle: '緊急' }
        ];

        // Firebase에서 로드할 데이터
        let dialoguesData = {};
        let vocabularyData = [];
        let quizzesData = [];

        const tips = {
            restaurant: '일본 라멘집에서는 보통 식권기(食券機)에서 먼저 티켓을 구매해요. 면의 굵기나 육수 농도를 물어볼 수 있으니 미리 원하는 스타일을 생각해두세요!',
            airport: '일본 입국 시 지문과 사진 촬영이 필수입니다. 입국카드는 미리 기내에서 작성해두면 시간을 절약할 수 있어요!',
            shopping: '일본에서 5,000엔 이상 구매 시 면세 혜택을 받을 수 있어요. 여권을 꼭 지참하세요!',
            hotel: '일본 호텔은 체크인이 보통 15시, 체크아웃이 10-11시입니다. 짐은 미리 맡겨두고 관광할 수 있어요!',
            transport: 'IC카드(Suica, Pasmo)를 구매하면 충전해서 편리하게 이용할 수 있어요!',
            emergency: '일본 경찰 신고는 110, 소방/구급은 119입니다. 교번(파출소)은 24시간 운영됩니다!'
        };

        // ==================== 상태 관리 ====================
        let currentCategory = 'restaurant';
        let currentTab = 'conversation';
        let currentVocabCategory = '전체';
        let currentSavedType = 'phrases';

        // 저장함 데이터 (localStorage)
        let savedPhrases = JSON.parse(localStorage.getItem('savedPhrases') || '[]');
        let savedWords = JSON.parse(localStorage.getItem('savedWords') || '[]');
        let savedMistakes = JSON.parse(localStorage.getItem('savedMistakes') || '[]');

        // 퀴즈 상태
        let quizIndex = 0;
        let quizScore = 0;
        let quizAnswered = false;
        let currentQuizzes = [];

        // ==================== 관리자 로그인 ====================
        function handleAdminClick() {
            if (isAdminLoggedIn) {
                openAdminModal();
            } else {
                openLoginModal();
            }
        }

        function openLoginModal() {
            document.getElementById('login-modal').classList.add('active');
            document.getElementById('admin-password').value = '';
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('admin-password').focus();
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.remove('active');
        }

        function handlePasswordKeypress(event) {
            if (event.key === 'Enter') {
                attemptLogin();
            }
        }

        function attemptLogin() {
            const password = document.getElementById('admin-password').value;
            if (password === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                closeLoginModal();
                updateAdminUI();
                openAdminModal();
                showToast('👑 관리자 모드로 전환되었습니다!');
            } else {
                document.getElementById('login-error').style.display = 'block';
                document.getElementById('admin-password').value = '';
                document.getElementById('admin-password').focus();
            }
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            closeAdminModal();
            updateAdminUI();
            showToast('🔒 관리자 모드가 종료되었습니다.');
        }

        function updateAdminUI() {
            const toggleBtn = document.getElementById('admin-toggle');
            const badge = document.getElementById('admin-badge');
            
            if (isAdminLoggedIn) {
                toggleBtn.classList.add('logged-in');
                badge.classList.add('show');
            } else {
                toggleBtn.classList.remove('logged-in');
                badge.classList.remove('show');
            }
        }

        // ==================== 유틸리티 함수 ====================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function speak(text) {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.8;
            speechSynthesis.speak(utterance);
        }

        function savePhraseToStorage(phrase) {
            const exists = savedPhrases.find(p => p.japanese === phrase.japanese);
            if (!exists) {
                savedPhrases.push(phrase);
                localStorage.setItem('savedPhrases', JSON.stringify(savedPhrases));
                showToast('💾 회화가 저장되었습니다!');
            } else {
                savedPhrases = savedPhrases.filter(p => p.japanese !== phrase.japanese);
                localStorage.setItem('savedPhrases', JSON.stringify(savedPhrases));
                showToast('🗑️ 저장이 해제되었습니다.');
            }
            updateSavedCounts();
            renderDialogues();
        }

        function saveWordToStorage(word) {
            const exists = savedWords.find(w => w.japanese === word.japanese);
            if (!exists) {
                savedWords.push(word);
                localStorage.setItem('savedWords', JSON.stringify(savedWords));
                showToast('💾 단어가 저장되었습니다!');
            } else {
                savedWords = savedWords.filter(w => w.japanese !== word.japanese);
                localStorage.setItem('savedWords', JSON.stringify(savedWords));
                showToast('🗑️ 저장이 해제되었습니다.');
            }
            updateSavedCounts();
            renderVocabulary();
        }

        function saveMistakeToStorage(quiz) {
            const exists = savedMistakes.find(m => m.question === quiz.question);
            if (!exists) {
                savedMistakes.push(quiz);
                localStorage.setItem('savedMistakes', JSON.stringify(savedMistakes));
            }
            updateSavedCounts();
        }

        function updateSavedCounts() {
            document.getElementById('saved-phrases-count').textContent = savedPhrases.length;
            document.getElementById('saved-words-count').textContent = savedWords.length;
            document.getElementById('saved-mistakes-count').textContent = savedMistakes.length;
        }

        // ==================== 탭 전환 ====================
        function showTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.querySelectorAll('nav button').forEach((btn, i) => {
                btn.classList.remove('active');
                if ((tabName === 'conversation' && i === 0) ||
                    (tabName === 'vocabulary' && i === 1) ||
                    (tabName === 'quiz' && i === 2) ||
                    (tabName === 'saved' && i === 3)) {
                    btn.classList.add('active');
                }
            });

            if (tabName === 'vocabulary') renderVocabulary();
            if (tabName === 'quiz') initQuiz();
            if (tabName === 'saved') renderSaved();
        }

        // ==================== 회화 렌더링 ====================
        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = defaultCategories.map(cat => `
                <div class="category-card ${cat.id === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
                    <div class="category-icon">${cat.icon}</div>
                    <div class="category-title">${cat.title}</div>
                    <div class="category-subtitle">${cat.subtitle}</div>
                </div>
            `).join('');
        }

        function selectCategory(categoryId) {
            currentCategory = categoryId;
            document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="selectCategory('${categoryId}')"]`).classList.add('active');
            renderDialogues();
        }

        function renderDialogues() {
            const dialogues = dialoguesData[currentCategory] || [];
            const container = document.getElementById('dialogue-container');
            const category = defaultCategories.find(c => c.id === currentCategory);

            document.getElementById('conversation-title').textContent = `${category?.title || ''} 회화`;
            document.getElementById('situation-badge').textContent = `${category?.icon || ''} ${category?.title || ''} 상황`;

            if (dialogues.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">

        // ==================== 퀴즈 ====================
        function initQuiz() {
            if (quizzesData.length === 0) {
                document.getElementById('quiz-content').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❓</div>
                        <p>아직 등록된 퀴즈가 없습니다.</p>
                        ${isAdminLoggedIn ? '<p style="margin-top: 0.5rem;">관리자 패널에서 퀴즈를 추가해보세요!</p>' : ''}
                    </div>
                `;
                document.getElementById('quiz-progress').innerHTML = '';
                return;
            }

            currentQuizzes = [...quizzesData].sort(() => Math.random() - 0.5).slice(0, Math.min(5, quizzesData.length));
            quizIndex = 0;
            quizScore = 0;
            quizAnswered = false;
            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-content');
            const progressContainer = document.getElementById('quiz-progress');

            progressContainer.innerHTML = currentQuizzes.map((_, i) => `
                <div class="quiz-dot ${i === quizIndex ? 'active' : ''} ${i < quizIndex ? 'correct' : ''}"></div>
            `).join('');

            if (quizIndex >= currentQuizzes.length) {
                const percentage = Math.round((quizScore / currentQuizzes.length) * 100);
                let message = '';
                if (percentage === 100) message = '완벽해요! 🎉';
                else if (percentage >= 80) message = '훌륭해요! 👏';
                else if (percentage >= 60) message = '잘했어요! 💪';
                else message = '다시 도전해보세요! 📚';

                container.innerHTML = `
                    <div class="quiz-result">
                        <div class="quiz-score">${quizScore}/${currentQuizzes.length}</div>
                        <div class="quiz-message">${message}</div>
                        <button class="btn btn-primary" onclick="initQuiz()">다시 도전하기</button>
                    </div>
                `;
                return;
            }

            const quiz = currentQuizzes[quizIndex];
            const shuffledOptions = [...quiz.options].sort(() => Math.random() - 0.5);

            container.innerHTML = `
                <div class="quiz-question">${quiz.question}</div>
                <div class="quiz-hint">${quiz.hint || ''}</div>
                <div class="quiz-options">
                    ${shuffledOptions.map(opt => `
                        <button class="quiz-option" onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', '${quiz.answer.replace(/'/g, "\\'")}', this)">${opt}</button>
                    `).join('')}
                </div>
            `;
        }

        function checkAnswer(selected, correct, button) {
            if (quizAnswered) return;
            quizAnswered = true;

            const isCorrect = selected === correct;
            button.classList.add(isCorrect ? 'correct' : 'wrong');

            if (isCorrect) {
                quizScore++;
            } else {
                document.querySelectorAll('.quiz-option').forEach(btn => {
                    if (btn.textContent === correct) btn.classList.add('correct');
                });
                saveMistakeToStorage(currentQuizzes[quizIndex]);
            }

            setTimeout(() => {
                quizIndex++;
                quizAnswered = false;
                renderQuiz();
            }, 1200);
        }

        // ==================== 데이터 추가 함수 ====================
        async function addDialogue() {
            const category = document.getElementById('dialogue-category').value;
            const speaker = document.getElementById('dialogue-speaker').value;
            const name = document.getElementById('dialogue-name').value;
            const japanese = document.getElementById('dialogue-japanese').value;
            const reading = document.getElementById('dialogue-reading').value;
            const romaji = document.getElementById('dialogue-romaji').value;
            const korean = document.getElementById('dialogue-korean').value;

            if (!japanese || !korean || !reading) {
                showToast('⚠️ 필수 항목을 입력해주세요.');
                return;
            }

            const newDialogue = {
                category,
                speaker,
                name: name || (speaker === 'customer' ? '나' : '상대방'),
                role: speaker === 'customer' ? '여행자' : '店員',
                avatar: speaker === 'customer' ? '🙋' : '👤',
                japanese,
                reading,
                romaji,
                korean,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                const docRef = await db.collection('dialogues').add(newDialogue);
                newDialogue.id = docRef.id;
                
                if (!dialoguesData[category]) {
                    dialoguesData[category] = [];
                }
                dialoguesData[category].push(newDialogue);

                showToast('✅ 회화가 추가되었습니다!');
                renderDialogues();
                renderAdminLists();

                // 입력 필드 초기화
                document.getElementById('dialogue-name').value = '';
                document.getElementById('dialogue-japanese').value = '';
                document.getElementById('dialogue-reading').value = '';
                document.getElementById('dialogue-romaji').value = '';
                document.getElementById('dialogue-korean').value = '';
            } catch (error) {
                console.error('Error adding dialogue:', error);
                showToast('❌ 추가 중 오류가 발생했습니다.');
            }
        }

        // ==================== Firebase 데이터 로드 ====================
        async function loadFromFirebase() {
            try {
                // 회화 로드
                const dialoguesSnap = await db.collection('dialogues').orderBy('createdAt', 'asc').get();
                dialoguesSnap.forEach(doc => {
                    const data = { id: doc.id, ...doc.data() };
                    if (!dialoguesData[data.category]) {
                        dialoguesData[data.category] = [];
                    }
                    dialoguesData[data.category].push(data);
                });

                // 단어 로드
                const vocabSnap = await db.collection('vocabulary').orderBy('createdAt', 'asc').get();
                vocabSnap.forEach(doc => {
                    vocabularyData.push({ id: doc.id, ...doc.data() });
                });

                // 퀴즈 로드
                const quizSnap = await db.collection('quizzes').orderBy('createdAt', 'asc').get();
                quizSnap.forEach(doc => {
                    quizzesData.push({ id: doc.id, ...doc.data() });
                });

                console.log('✅ Firebase 데이터 로드 완료');
                renderDialogues();
            } catch (error) {
                console.error('Firebase 로드 오류:', error);
                showToast('⚠️ 데이터 로드 중 오류가 발생했습니다.');
            }
        }

            renderCategories();
            updateSavedCounts();
            
            // Firebase에서 데이터 로드
            await loadFromFirebase();
            
            renderDialogues();
        });

        // 모달 외부 클릭 시 닫기
        document.getElementById('admin-modal').addEventListener('click', (e) => {
            if (e.target.id === 'admin-modal') closeAdminModal();
        });
        document.getElementById('login-modal').addEventListener('click', (e) => {
            if (e.target.id === 'login-modal') closeLoginModal();
        });
    </script>
</body>
</html>
